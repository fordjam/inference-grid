[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "inference-grid"
version = "0.1.0a1"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
classifiers = ["Development Status :: 3 - Alpha", "Programming Language :: Python :: 3.12", "Operating System :: POSIX"]
description = "Subscription-aware durable admission for bounded inference jobs"
requires-python = ">=3.12"
dependencies = ["sqlalchemy>=2.0,<2.1", "psycopg[binary]>=3.2,<4", "celery>=5.6.3,<6"]

[project.optional-dependencies]
test = ["pytest>=8,<9"]

[project.scripts]
inference-grid = "inference_grid.cli:main"
inference-grid-capacity = "inference_grid.capacity:main"

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]


[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F"]

[tool.setuptools.package-data]
inference_grid = ["capacity_web/*"]
