name: tests
on: [push, pull_request]
permissions:
  contents: read
jobs:
  evaluate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: grid
          POSTGRES_PASSWORD: ci-only-password
          POSTGRES_DB: grid
        ports: ["5432:5432"]
        options: --health-cmd "pg_isready -U grid" --health-interval 5s --health-timeout 3s --health-retries 10
      rabbitmq:
        image: rabbitmq:4
        ports: ["5672:5672"]
        options: --health-cmd "rabbitmq-diagnostics -q ping" --health-interval 5s --health-timeout 5s --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install -r requirements.lock && pip install --no-deps -e .
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Capacity HTTP and browser-state regressions
        run: |
          (cd deployments/capacity && python -m unittest -v test_cloud)
          node deployments/capacity/test_display.cjs
          node deployments/capacity/test_refresh.cjs
          cmp src/inference_grid/capacity.py deployments/capacity/capacity.py
      - name: Build and install release wheel
        run: |
          python -m pip wheel --no-deps . -w dist
          python -m venv /tmp/grid-install
          /tmp/grid-install/bin/pip install dist/*.whl
          /tmp/grid-install/bin/inference-grid --help
          /tmp/grid-install/bin/python examples/demo.py
      - name: Capacity deployment build
        run: docker build -t grid-capacity-test deployments/capacity
      - run: pytest -q
      - run: pytest -q
        env:
          GRID_TEST_DATABASE_URL: postgresql+psycopg://grid:ci-only-password@localhost:5432/grid
      - run: |
          python - <<'PYCODE'
          import psycopg
          with psycopg.connect("postgresql://grid:ci-only-password@localhost:5432/grid", autocommit=True) as con:
              con.execute("CREATE DATABASE grid_broker")
          PYCODE
      - run: pytest -q tests/test_broker.py tests/test_broker_recovery.py
        env:
          GRID_RUN_BROKER_TEST: '1'
          GRID_DATABASE_URL: postgresql+psycopg://grid:ci-only-password@localhost:5432/grid_broker
          GRID_BROKER_URL: amqp://guest:guest@localhost:5672//
          GRID_TEST_BROKER_RESTART: '["docker", "restart", "${{ job.services.rabbitmq.id }}"]'
