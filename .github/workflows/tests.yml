name: tests
on: [push, pull_request]
permissions:
  contents: read
jobs:
  evaluate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install -r requirements.lock && pip install --no-deps -e .
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Capacity HTTP and browser-state regressions
        run: |
          (cd deployments/capacity && python -m unittest -v test_cloud test_refresh_end_to_end)
          node deployments/capacity/test_display.cjs
          node deployments/capacity/test_refresh.cjs
          cmp src/inference_grid/capacity.py deployments/capacity/capacity.py
      - name: Build and install release wheel
        run: |
          python -m pip wheel --no-deps . -w dist
          python -m venv /tmp/grid-install
          /tmp/grid-install/bin/pip install dist/*.whl
          /tmp/grid-install/bin/inference-grid --help
          /tmp/grid-install/bin/python examples/demo.py
      - name: Capacity deployment build
        run: docker build -t grid-capacity-test deployments/capacity
      - run: pytest -q
